<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENT303 App</title>
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --ink: #1e293b; --mut: #64748b;
      --rose: #f43f5e; --line: #e2e8f0; --ok: #10b981; --chip: #f1f5f9;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); padding-bottom: 80px; }
    header { position: sticky; top: 0; z-index: 20; display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: var(--card); border-bottom: 1px solid var(--line); }
    header b { font-size: 1.2rem; color: var(--rose); white-space: nowrap; }
    header select { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--line); font-weight: 600; }
    main { max-width: 800px; margin: 0 auto; padding: 16px; }
    .card { background: var(--card); border-radius: 16px; padding: 16px; border: 1px solid var(--line); margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 10px 0; z-index: 30; }
    nav button { border: 0; background: none; color: var(--mut); font-weight: 600; cursor: pointer; }
    nav button.on { color: var(--rose); font-weight: 800; }
  </style>
</head>
<body>
  <header>
    <b>ENT303 App</b>
    <select id="unitSelect" onchange="changeUnit(this.value)">
      <option value="1">Unit 1: Greetings & Small Talk</option>
      <option value="2">Unit 2: Cultural Literacy</option>
    </select>
  </header>

  <main id="mainContent"></main>

  <nav>
    <button id="btn-home" class="on" onclick="switchTab('home')">🏠 Trang chủ</button>
    <button id="btn-vocab" onclick="switchTab('vocab')">📚 Từ vựng</button>
    <button id="btn-quiz" onclick="switchTab('quiz')">🎮 Luyện tập</button>
  </nav>

  <script>
    const DATA = {
      "1": [
        { "w": "allow", "p": "v", "d": "cho phép" },
        { "w": "prohibition", "p": "n", "d": "điều cấm kỵ" },
        { "w": "customary", "p": "a", "d": "theo phong tục" },
        { "w": "address", "p": "v", "d": "dùng tên hoặc chức tước xưng hô" }
      ],
      "2": [
        { "w": "etiquette", "p": "n", "d": "phép lịch sự" },
        { "w": "polite", "p": "a", "d": "lịch sự" },
        { "w": "rude", "p": "a", "d": "vô lễ" }
      ]
    };

    let currentUnit = "1";
    let currentTab = "home";

    function changeUnit(u) {
      currentUnit = u;
      render();
    }

    function switchTab(t) {
      currentTab = t;
      document.querySelectorAll('nav button').forEach(function(b) {
        b.classList.remove('on');
      });
      const btn = document.getElementById('btn-' + t);
      if (btn) btn.classList.add('on');
      render();
    }

    function render() {
      const main = document.getElementById('mainContent');
      if (!main) return;

      const list = DATA[currentUnit] || [];

      if (currentTab === 'home') {
        main.innerHTML = '<div class="card" style="background: linear-gradient(135deg, #f97316, #f43f5e); color:#fff;"><h2 style="margin:0">🔥 Chuỗi học: 1 ngày</h2><p style="margin:5px 0 0 0">Hãy duy trì thói quen học mỗi ngày nhé!</p></div><div class="grid"><div class="card" onclick="switchTab(\'vocab\')" style="cursor:pointer"><h3>📚 Từ vựng Unit ' + currentUnit + '</h3><p>Có ' + list.length + ' từ vựng cần học</p></div><div class="card" onclick="switchTab(\'quiz\')" style="cursor:pointer"><h3>🎮 Ôn tập Quiz</h3><p>Trắc nghiệm & Ghép từ</p></div></div>';
      } else if (currentTab === 'vocab') {
        let html = '<h2>📚 Từ vựng Unit ' + currentUnit + '</h2><div class="grid">';
        for (let i = 0; i < list.length; i++) {
          html += '<div class="card"><div style="display:flex; justify-content:space-between; align-items:center;"><b style="font-size:1.2rem; color:var(--rose);">' + list[i].w + '</b><small style="background:var(--chip); padding:2px 6px; border-radius:4px;">' + list[i].p + '</small></div><p style="margin:8px 0 0 0; font-weight:600;">' + list[i].d + '</p></div>';
        }
        html += '</div>';
        main.innerHTML = html;
      } else if (currentTab === 'quiz') {
        main.innerHTML = '<h2>🎮 Luyện tập Unit ' + currentUnit + '</h2><div class="card"><p>Tính năng ôn tập trắc nghiệm đã sẵn sàng!</p><button onclick="alert(\'Bắt đầu bài kiểm tra!\')" style="padding:10px 20px; background:var(--rose); color:#fff; border:0; border-radius:8px; font-weight:bold; cursor:pointer;">Bắt đầu ngay</button></div>';
      }
    }

    window.onload = function() {
      render();
    };
  </script>
</body>
</html>
